<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genisys API 文档查询站</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1f2329; --muted:#6b7280;
    --line:#e4e7eb; --accent:#2563eb; --accent-soft:#e8f0fe;
    --chip:#eef1f4; --chip-on:#2563eb; --ok:#0a7d3c; --warn:#b45309;
    --code-bg:#f3f4f6; --pre-bg:#1e293b; --pre-ink:#e2e8f0;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.6 -apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--ink)}
  header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
         padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
  .grow{flex:1}
  .search{flex:1;min-width:220px;max-width:520px;position:relative}
  .search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:8px;
                font-size:14px;background:var(--bg);color:var(--ink)}
  .search input:focus{outline:none;border-color:var(--accent);background:#fff}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5}
  .hdr-link{color:var(--accent);cursor:pointer;font-size:13.5px;font-weight:600;white-space:nowrap;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--chip)}
  .hdr-link:hover{border-color:var(--accent);background:var(--accent-soft)}
  .filters{display:flex;gap:18px;flex-wrap:wrap;padding:10px 18px 4px;background:var(--panel);
           border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:19}
  .fgroup{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .fgroup .lbl{color:var(--muted);font-size:12px;margin-right:2px}
  .chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:4px 11px;border-radius:999px;
        cursor:pointer;font-size:12.5px;user-select:none;transition:.12s}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--chip-on);color:#fff;border-color:var(--chip-on)}
  main{display:flex;gap:0;align-items:flex-start;min-height:calc(100vh - 112px)}
  /* 列表视图 */
  #list{padding:16px 18px;width:100%;max-width:920px;margin:0 auto}
  .card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px 16px;margin-bottom:12px;
        cursor:pointer;transition:.12s}
  .card:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(37,99,235,.08)}
  .card .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
  .tag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:600}
  .tag.core{background:#fde8e8;color:#c0392b}
  .tag.study{background:#ecfdf3;color:var(--ok)}
  .card h3{margin:0;font-size:15px}
  .card .meta{color:var(--muted);font-size:12px;margin-top:2px}
  .hits{margin-top:8px;display:flex;flex-direction:column;gap:3px}
  .hit{font-size:12.5px;color:#374151}
  .hit .h{color:var(--accent);font-weight:600}
  .hit .snip{color:var(--muted)}
  mark{background:#fff3a3;color:inherit;border-radius:2px;padding:0 1px}
  .empty{text-align:center;color:var(--muted);padding:60px 0}
  /* 阅读视图 */
  #reader{display:none;width:100%}
  #reader.active{display:flex}
  .docwrap{flex:1;min-width:0;padding:22px 30px 80px;max-width:860px;margin:0 auto}
  .docwrap .back{color:var(--accent);cursor:pointer;font-size:13px;margin-bottom:10px;display:inline-block}
  .toc{width:260px;flex:none;position:sticky;top:112px;align-self:flex-start;max-height:calc(100vh - 130px);
       overflow:auto;padding:18px 14px;border-left:1px solid var(--line);background:var(--panel)}
  .toc h4{margin:0 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .toc a{display:block;color:#374151;text-decoration:none;padding:3px 8px;border-radius:6px;font-size:13px;
         border-left:2px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toc a:hover{background:var(--bg);color:var(--accent)}
  .toc a.lv3{padding-left:20px;font-size:12.5px;color:var(--muted)}
  .toc a.lv4{padding-left:32px;font-size:12px;color:var(--muted)}
  .toc a.active{background:var(--accent-soft);color:var(--accent);border-left-color:var(--accent)}
  /* 渲染后的 markdown 内容样式 */
  .content h1,.content h2,.content h3,.content h4{border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:28px;scroll-margin-top:120px}
  .content h1{font-size:24px}.content h2{font-size:20px}.content h3{font-size:17px}
  .content table{border-collapse:collapse;width:100%;margin:14px 0;font-size:13px}
  .content th,.content td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
  .content th{background:var(--bg);font-weight:600}
  .content tr:nth-child(even) td{background:#fafbfc}
  .content code{background:var(--code-bg);padding:1.5px 5px;border-radius:4px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
  .content pre{background:var(--pre-bg);color:var(--pre-ink);padding:14px 16px;border-radius:8px;overflow:auto}
  .content pre code{background:transparent;color:inherit;padding:0}
  .content blockquote{border-left:3px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);color:#1e3a8a;border-radius:0 6px 6px 0}
  .content a{color:var(--accent)}
  .content ul,.content ol{padding-left:22px}
  footer{text-align:center;color:var(--muted);font-size:11.5px;padding:14px;border-top:1px solid var(--line);background:var(--panel)}
  .spin{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>📚 Genisys API 文档查询站</h1>
  <div class="grow"></div>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
    <input id="q" type="text" placeholder="搜索类名 / 方法 / 事件 / 协议包 / 版本差异…（中文也可）" autocomplete="off">
  </div>
  <a id="aboutLink" class="hdr-link" title="关于本站">关于</a>
</header>

<div class="filters">
  <div class="fgroup" id="verChips"><span class="lbl">版本</span></div>
  <div class="fgroup" id="typeChips"><span class="lbl">类型</span></div>
</div>

<main>
  <section id="list"></section>
  <section id="reader">
    <div class="docwrap">
      <a class="back" id="backBtn">← 返回列表</a>
      <div class="content" id="content"><div class="spin">加载中…</div></div>
    </div>
    <nav class="toc" id="toc"><h4>本页目录</h4></nav>
  </section>
</main>

<footer>动态生成 · 每次请求实时渲染 <code>docs/</code> 下的 Markdown · 改完文档刷新即可见</footer>

<script>
const VERSION_ORDER = ["0.13","0.14.0","0.14.3","0.15.0","0.16.0","1.0.0"];
const STATE = { docs: [], ver: "all", type: "all", q: "", open: null };
const $ = (s) => document.querySelector(s);

function tokenize(s){ return (s||"").toLowerCase().split(/\s+/).filter(Boolean); }

function matches(d){
  if (STATE.ver !== "all" && d.version !== STATE.ver) return false;
  if (STATE.type !== "all" && d.vtype !== STATE.type) return false;
  const qw = tokenize(STATE.q);
  if (!qw.length) return true;
  const text = d.search_text.toLowerCase();
  const htitles = d.headings.map(h => h.title.toLowerCase()).join(" ");
  return qw.every(w => text.includes(w) || htitles.includes(w));
}

function hitInfo(d){
  const qw = tokenize(STATE.q);
  if (!qw.length) return [];
  const res = [];
  // 章节命中
  const hitHeads = d.headings.filter(h => qw.every(w => h.title.toLowerCase().includes(w)));
  hitHeads.slice(0,4).forEach(h => res.push({ type:"h", title:h.title, slug:h.slug }));
  if (res.length >= 4) return res;
  // 正文命中片段
  const low = d.search_text.toLowerCase();
  let idx = low.indexOf(qw[0]);
  if (idx >= 0){
    const start = Math.max(0, idx - 40);
    let snip = d.search_text.slice(start, idx + 120).trim();
    res.push({ type:"t", title:"正文", snip });
  }
  return res.slice(0,4);
}

function hl(text, qw){
  if (!qw.length) return esc(text);
  const re = new RegExp("(" + qw.map(escapeRe).join("|") + ")", "ig");
  return esc(text).replace(re, "<mark>$1</mark>");
}
function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function esc(s){ return (s||"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function renderList(){
  const box = $("#list");
  const qw = tokenize(STATE.q);
  const items = STATE.docs.filter(matches);
  if (!items.length){
    box.innerHTML = '<div class="empty">没有匹配的文档。试试别的关键词，或切换版本/类型筛选。</div>';
    return;
  }
  box.innerHTML = items.map(d => {
    const hits = hitInfo(d).map(h => {
      if (h.type === "h")
        return '<div class="hit"><span class="h">'+esc(h.title)+'</span> · <a style="color:var(--muted)" href="#" data-file="'+d.file+'" data-slug="'+h.slug+'">跳转</a></div>';
      return '<div class="hit"><span class="h">正文</span> <span class="snip">'+hl(h.snip, qw)+'</span></div>';
    }).join("");
    return '<div class="card" data-file="'+d.file+'">'
      + '<div class="top"><span class="tag '+d.vtype+'">'+d.label+'</span>'
      + '<span class="tag">'+d.version+'</span>'
      + '<h3>'+esc(d.title)+'</h3></div>'
      + '<div class="meta">'+d.file+' · '+d.headings.length+' 个章节</div>'
      + (hits ? '<div class="hits">'+hits+'</div>' : '')
      + '</div>';
  }).join("");
}

function renderChips(){
  const vers = ["all"].concat(VERSION_ORDER);
  $("#verChips").querySelectorAll(".chip").forEach(e=>e.remove());
  vers.forEach(v => {
    const c = document.createElement("span");
    c.className = "chip" + (STATE.ver === v ? " on" : "");
    c.textContent = v === "all" ? "全部" : v;
    c.onclick = () => { STATE.ver = v; renderChips(); renderList(); };
    $("#verChips").appendChild(c);
  });
  const types = [["all","全部"],["plugin","插件 API"],["core","核心 API"],["study","关于"]];
  $("#typeChips").querySelectorAll(".chip").forEach(e=>e.remove());
  types.forEach(([t,lbl]) => {
    const c = document.createElement("span");
    c.className = "chip" + (STATE.type === t ? " on" : "");
    c.textContent = lbl;
    c.onclick = () => { STATE.type = t; renderChips(); renderList(); };
    $("#typeChips").appendChild(c);
  });
}

async function openDoc(file, slug){
  STATE.open = file;
  $("#list").style.display = "none";
  $("#reader").classList.add("active");
  $("#content").innerHTML = '<div class="spin">渲染中…</div>';
  $("#toc").querySelectorAll("a").forEach(e=>e.remove());
  try{
    const r = await fetch("/api/render?file=" + encodeURIComponent(file));
    const d = await r.json();
    $("#content").innerHTML = d.html;
    // TOC
    const toc = $("#toc");
    d.headings.forEach(h => {
      const a = document.createElement("a");
      a.href = "#" + h.slug;
      a.className = "lv" + h.level;
      a.textContent = h.title;
      a.onclick = (e) => { e.preventDefault(); document.getElementById(h.slug)?.scrollIntoView({behavior:"smooth"}); };
      toc.appendChild(a);
    });
    if (slug) document.getElementById(slug)?.scrollIntoView();
    setupSpy();
  }catch(err){
    $("#content").innerHTML = '<div class="spin">渲染失败：'+esc(err.message)+'</div>';
  }
}

function closeDoc(){
  STATE.open = null;
  $("#reader").classList.remove("active");
  $("#list").style.display = "";
}

let spy = null;
function setupSpy(){
  if (spy) spy.disconnect();
  const links = [...$("#toc").querySelectorAll("a")];
  if (!links.length) return;
  const map = {};
  links.forEach(a => { const id = a.getAttribute("href").slice(1); map[id] = a; });
  spy = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (en.isIntersecting){
        links.forEach(l => l.classList.remove("active"));
        const a = map[en.target.id];
        if (a) a.classList.add("active");
      }
    });
  }, { rootMargin: "-80px 0px -70% 0px" });
  document.querySelectorAll(".content h1,.content h2,.content h3,.content h4").forEach(h => spy.observe(h));
}

// 事件委托
$("#list").addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  const jump = e.target.closest("a[data-slug]");
  if (jump){
    e.preventDefault();
    openDoc(jump.dataset.file, jump.dataset.slug);
    return;
  }
  if (card) openDoc(card.dataset.file);
});
$("#backBtn").onclick = closeDoc;
$("#aboutLink").onclick = () => openDoc("pmmp-apidoc-study.md");
let t;
$("#q").addEventListener("input", (e) => {
  clearTimeout(t);
  t = setTimeout(() => { STATE.q = e.target.value; renderList(); }, 120);
});

async function boot(){
  renderChips();
  try{
    const r = await fetch("/api/list");
    STATE.docs = await r.json();
    renderList();
  }catch(err){
    $("#list").innerHTML = '<div class="empty">加载失败：'+esc(err.message)+'</div>';
  }
}
boot();
</script>
</body>
</html>
